name: Cross-platform verification

# Pull requests run the offline suite. Main pushes also run the real pinned ViT path.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.10 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      HF_HUB_DISABLE_XET: "1"
      KMP_DUPLICATE_LIB_OK: "TRUE"

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install CPython 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned top-level dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run the offline automated suite
        run: python -m pytest -q

      - name: Restore the pinned ViT cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/huggingface
          key: vit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('models/pretrained_model_manifest.json') }}

      - name: Bootstrap and verify the real core model path
        if: github.event_name != 'pull_request'
        run: python scripts/bootstrap.py --profile core --skip-install --allow-system-python

      - name: Run a real API and ViT smoke analysis
        if: github.event_name != 'pull_request'
        run: python scripts/smoke_test.py

      - name: Run the pinned-snapshot integration tests
        if: github.event_name != 'pull_request'
        run: python -m pytest -q tests/test_features.py

      - name: Confirm setup did not modify tracked files
        if: github.event_name != 'pull_request'
        run: git diff --exit-code
